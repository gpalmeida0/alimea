name: Weekly backup

# Every Sunday at 03:00 UTC, and on demand from the Actions tab.
# Dumps the database (app data + user accounts) and the uploaded files,
# encrypts them, and keeps them as a workflow artifact for 90 days.
# Restore steps: docs/backups.md
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          for name in SUPABASE_DB_URL NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_PASSPHRASE; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name (see docs/backups.md)"; exit 1; fi
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # pg_dump must be at least the server's major version.
      - name: Install a matching PostgreSQL client
        run: |
          major=$(psql "$SUPABASE_DB_URL" -tAc "show server_version_num" | cut -c1-2)
          echo "Server is PostgreSQL $major"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$major"
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"

      - name: Dump the database
        run: |
          mkdir -p backup
          # public = app data, auth = accounts and 2FA factors. (The file index in
          # "storage" is rebuilt when the files are uploaded back.)
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file=backup/database.dump
          # Fails here if the dump is unreadable, before anything is stored.
          pg_restore --list backup/database.dump > /dev/null
          echo "Tables in public:" && pg_restore --list backup/database.dump | grep -c "TABLE DATA public"

      - name: Download uploaded files
        run: npm run -s backup:storage -- download backup/files

      - name: Encrypt
        run: |
          stamp=$(date -u +%Y-%m-%d)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          tar -czf - -C backup . | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 --output "alimea-backup-$stamp.tar.gz.gpg" 3<<< "$BACKUP_PASSPHRASE"
          rm -rf backup
          ls -lh "alimea-backup-$stamp.tar.gz.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: alimea-backup-${{ env.STAMP }}
          path: alimea-backup-${{ env.STAMP }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
